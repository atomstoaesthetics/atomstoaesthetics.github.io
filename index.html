<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      body {
    /* Replace the URL with your image link */

}
      body {
    /* ... rest of your code ... */
          font-family: sans-serif;
          display: flex;
          /* "wrap" allows items to move to the next line on small screens */
          flex-wrap: wrap; 
          justify-content: center;
          align-items: center;
          gap: 40px;
          /* Change height to min-height so it can grow if images stack */
          min-height: 100vh; 
          margin: 0;
          padding: 20px; /* Adds space so images don't touch screen edges */
          background-color: #f0f2f5;
      }
  
      .image-container {
          text-align: center;
          /* Ensure the container doesn't exceed the phone's width */
          width: 100%;
          max-width: 400px; 
      }
  
      img {
          /* This is the secret: it will be 100% of the container's width */
          width: 100%; 
          height: auto; /* Maintains the correct proportions */
          border-radius: 12px;
          cursor: pointer;
          transition: transform 0.3s ease, box-shadow 0.3s ease;
          box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
  
      img:hover {
          transform: scale(1.15);
          box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      }
  
      img:active {
          transform: scale(0.95);
      }

      @media (max-width: 400px) {
        body {
            /* Reduces the space between the two containers */
            gap: 0px; 
            /* Optional: reduces padding at the top/bottom of the page */
            padding: 10px; 
        }

        .image-container p {
            /* Paragraphs have large default margins; this shrinks them */
            margin-top: 10px;
            margin-bottom: 5px;
        }
    }
  </style>



</head>
<body>

    <div class="image-container">

    </div>
